<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BorderBrawlers — banco de animación</title>
    <!--
      Ícono embebido: sin esto el navegador pide /favicon.ico, no lo encuentra y
      deja un 404 en la consola que ensucia la única señal que mira el script de
      captura —"¿hubo errores?"— por un archivo que no existe a propósito.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230B0F19'/%3E%3Crect x='2' y='4' width='5' height='8' fill='%2300FF66'/%3E%3Crect x='9' y='4' width='5' height='8' fill='%23FF0055'/%3E%3C/svg%3E"
    />
    <style>
      html, body, #root { height: 100%; margin: 0; background: #0B0F19; }
      /* El cartel de la acción, sobre el lienzo y sin robarle el clic. */
      #accion {
        position: fixed; left: 12px; bottom: 12px; pointer-events: none;
        font-size: clamp(11px, 3vw, 14px); letter-spacing: .16em;
        text-transform: uppercase; color: #8ba0b8;
      }
      body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #e6edf3; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Qué acción está tirando el peleador. El banco las va rotando; sin el
         cartel hay que adivinar si lo que se ve es la patada o la habilidad. -->
    <div id="accion"></div>
    <script type="module" src="/src/dev/demo.ts"></script>
  </body>
</html>
